<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Touch</title>
    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 400px;
            height: 600px;
            overflow: hidden;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #87CEEB;
            color: #3d5a70;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Dreamy Sky Background - Warm Ghibli Countryside */
        .bg-gradient {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, 
                #FFE8D6 0%,     /* Warm peach cream - sunrise */
                #FFF5E9 20%,    /* Soft cream */
                #E3F2FD 45%,    /* Pale sky blue */
                #CDEEF6 70%,    /* Soft azure */
                #F4E4C1 100%    /* Wheat gold - distant hills */
            );
            z-index: 0;
        }

        /* Floating Cloud Elements */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 100px;
            z-index: 1;
            filter: blur(14px);
            animation: float-cloud 22s infinite ease-in-out;
        }
        
        .cloud-1 {
            width: 110px;
            height: 38px;
            top: 10%;
            left: -18px;
            animation-delay: 0s;
        }
        
        .cloud-2 {
            width: 85px;
            height: 30px;
            top: 25%;
            right: -12px;
            animation-delay: -9s;
        }
        
        .cloud-3 {
            width: 95px;
            height: 34px;
            bottom: 28%;
            left: 10%;
            animation-delay: -16s;
        }

        @keyframes float-cloud {
            0%, 100% { transform: translate(0, 0); opacity: 0.65; }
            50% { transform: translate(28px, -10px); opacity: 0.35; }
        }

        /* Subtle Paper Texture Overlay */
        .texture {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 25% 35%, rgba(255,248,230,0.18) 0%, transparent 50%),
                radial-gradient(circle at 75% 65%, rgba(255,240,220,0.12) 0%, transparent 50%);
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
        }

        /* Floating Particles - Gentle Windswept */
        .particle {
            position: absolute;
            width: 3px;
            height: 8px;
            background: linear-gradient(180deg, rgba(255, 245, 220, 0.5) 0%, transparent 100%);
            border-radius: 50%;
            z-index: 1;
            animation: float-particle-gentle 20s infinite ease-in-out;
        }
        
        .p1 { top: 15%; left: 18%; animation-delay: 0s; height: 6px; }
        .p2 { top: 40%; right: 22%; animation-delay: -7s; width: 2px; height: 7px; }
        .p3 { bottom: 32%; left: 28%; animation-delay: -13s; height: 9px; }
        .p4 { top: 58%; right: 16%; animation-delay: -9s; width: 2.5px; }
        
        @keyframes float-particle-gentle {
            0%, 100% { 
                transform: translate(0, 0) rotate(0deg); 
                opacity: 0.25; 
            }
            50% { 
                transform: translate(15px, -22px) rotate(8deg); 
                opacity: 0.6; 
            }
        }

        .popup-content {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px 24px;
            gap: 18px;
            position: relative;
            z-index: 2;
        }

        /* Storybook-Style Header - Hand-Drawn & Organic */
        .header {
            text-align: center;
            padding: 16px 20px 14px;
            background: linear-gradient(135deg, 
                rgba(255, 248, 240, 0.75) 0%,
                rgba(255, 245, 235, 0.65) 100%
            );
            border-radius: 22px;
            backdrop-filter: blur(12px);
            flex-shrink: 0;
            box-shadow: 
                0 6px 28px rgba(255, 230, 200, 0.25),
                0 2px 8px rgba(180, 150, 120, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 2.5px solid rgba(210, 170, 130, 0.45);
            position: relative;
            filter: drop-shadow(0 2px 4px rgba(180, 150, 120, 0.15));
        }

        /* Sketch-like inner border - matching other components */
        .header::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            border-radius: 20px;
            background: transparent;
            border: 1.5px solid rgba(255, 240, 220, 0.45);
            pointer-events: none;
        }

        /* Decorative hand-drawn grass motif */
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 3px;
            background: linear-gradient(90deg, 
                transparent 0%,
                rgba(230, 190, 150, 0.25) 15%,
                rgba(230, 190, 150, 0.4) 50%,
                rgba(230, 190, 150, 0.25) 85%,
                transparent 100%
            );
            border-radius: 3px;
            filter: blur(0.5px);
        }

        .title {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 4px;
            color: #8B6F47;
            letter-spacing: 0.8px;
            text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .subtitle {
            font-size: 0.73rem;
            opacity: 0.75;
            color: #A68B6C;
            letter-spacing: 1.2px;
            text-transform: lowercase;
            font-weight: 400;
            text-shadow: 0px 1px 2px rgba(255,255,255,0.9);
            font-style: italic;
        }

        /* Paper-like Status Card with Hand-Drawn Border */
        .status-card {
            background: linear-gradient(135deg, 
                rgba(255, 250, 242, 0.7) 0%,
                rgba(255, 248, 238, 0.6) 100%
            );
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 15px 18px;
            display: flex;
            align-items: center;
            gap: 13px;
            flex-shrink: 0;
            box-shadow: 
                0 6px 24px rgba(230, 200, 170, 0.15),
                0 2px 6px rgba(180, 150, 120, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(220, 180, 140, 0.4);
            position: relative;
        }

        /* Sketch-like inner border */
        .status-card::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            border-radius: 18px;
            border: 1px solid rgba(255, 240, 220, 0.5);
            pointer-events: none;
        }

        .status-icon {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #D4A574;
            box-shadow: 0 0 10px rgba(212, 165, 116, 0.4);
        }

        #status {
            color: #8B6F47;
            font-size: 0.84rem;
            font-weight: 500;
        }

        /* Hand-Drawn Button Style */
        #parseButton {
            background: linear-gradient(135deg, 
                rgba(255, 248, 235, 0.8) 0%, 
                rgba(255, 242, 220, 0.7) 100%
            );
            backdrop-filter: blur(12px);
            border: 2.5px solid rgba(200, 160, 120, 0.45);
            color: #8B6F47;
            padding: 13px 24px;
            font-size: 0.88rem;
            font-weight: 500;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
            box-shadow: 
                0 6px 20px rgba(230, 200, 170, 0.2),
                0 2px 6px rgba(180, 150, 120, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
            position: relative;
        }

        /* Sketch-like double border */
        #parseButton::after {
            content: '';
            position: absolute;
            top: 1.5px;
            left: 1.5px;
            right: 1.5px;
            bottom: 1.5px;
            border-radius: 22px;
            border: 1px solid rgba(255, 240, 220, 0.4);
            pointer-events: none;
        }

        #parseButton:hover:not(:disabled) {
            background: linear-gradient(135deg, 
                rgba(255, 250, 240, 0.9) 0%, 
                rgba(255, 245, 228, 0.8) 100%
            );
            transform: translateY(-2px);
            box-shadow: 
                0 8px 28px rgba(230, 200, 170, 0.3),
                0 3px 8px rgba(180, 150, 120, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        #parseButton:disabled {
            background: rgba(200, 200, 200, 0.3);
            color: #999;
            cursor: not-allowed;
            transform: none;
        }

        .result-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .result-title {
            font-size: 0.93rem;
            font-weight: 600;
            color: #8B6F47;
        }

        .result-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background: linear-gradient(135deg, 
                rgba(255, 248, 238, 0.6) 0%,
                rgba(255, 245, 230, 0.5) 100%
            );
            backdrop-filter: blur(10px);
            border: 1px solid rgba(230, 200, 170, 0.35);
            color: #8B6F47;
            padding: 6px 11px;
            border-radius: 12px;
            font-size: 0.74rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .action-btn:hover {
            background: linear-gradient(135deg, 
                rgba(255, 250, 242, 0.75) 0%,
                rgba(255, 248, 235, 0.65) 100%
            );
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(230, 200, 170, 0.2);
        }

        /* Enhanced Result Box - Paper Sketchbook with MUCH MORE SPACE */
        #resultBox {
            background: linear-gradient(135deg, 
                rgba(255, 252, 248, 0.7) 0%,
                rgba(255, 250, 245, 0.6) 100%
            );
            backdrop-filter: blur(15px);
            border: 2.5px solid rgba(210, 170, 130, 0.4);
            border-radius: 20px;
            padding: 28px;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 0.79rem;
            line-height: 2.1;
            color: #6B5842;
            flex: 1;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            resize: none;
            min-height: 300px;
            box-shadow: 
                0 6px 24px rgba(230, 200, 170, 0.12),
                0 2px 6px rgba(180, 150, 120, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.85),
                inset 2px 2px 8px rgba(255, 245, 230, 0.3);
            position: relative;
            letter-spacing: 0.3px;
        }

        /* Hand-drawn sketch border */
        #resultBox::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            border-radius: 18px;
            border: 1.5px solid rgba(255, 240, 220, 0.4);
            pointer-events: none;
        }

        #resultBox:empty::before {
            content: '✨ Parsed data will appear here... ✨';
            color: #C9A87C;
            font-style: italic;
            opacity: 0.6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        #resultBox::-webkit-scrollbar {
            width: 7px;
        }

        #resultBox::-webkit-scrollbar-track {
            background: rgba(255, 248, 235, 0.2);
            border-radius: 4px;
        }

        #resultBox::-webkit-scrollbar-thumb {
            background: rgba(212, 165, 116, 0.35);
            border-radius: 4px;
        }

        #resultBox::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 165, 116, 0.55);
        }

        /* Enhanced Key-Value Display - Warm & Clear */
        .json-key {
            color: #8B5A2B;
            font-weight: 700;
            text-shadow: 0px 1px 2px rgba(255,250,240,0.9);
        }

        .json-string {
            color: #A67C52;
            font-weight: 500;
        }

        .json-number {
            color: #D4A574;
            font-weight: 600;
        }

        .json-boolean {
            color: #B89968;
            font-weight: 600;
        }

        .json-null {
            color: #C9A87C;
            opacity: 0.65;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="texture"></div>
    
    <!-- Floating clouds -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    
    <!-- Floating particles -->
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>

    <div class="popup-content">
        <div class="header">
            <div class="title">Magic Touch Panel</div>
            <div class="subtitle">✨ Where Dreams Meet Technology ✨</div>
        </div>

        <div class="status-card">
            <div class="status-icon"></div>
            <div id="status">Ready to scrape...</div>
        </div>

        <button id="parseButton" disabled>🔍 Parse Page</button>

        <div class="result-container">
            <div class="result-header">
                <div class="result-title">📊 Parsed Data</div>
                <div class="result-actions">
                    <button id="copyBtn" class="action-btn">📋 Copy</button>
                    <button id="clearBtn" class="action-btn">🗑️ Clear</button>
                </div>
            </div>
            <div id="resultBox"></div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
